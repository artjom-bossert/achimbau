<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Doppelhaus Itzgrund 12 · Achim Bau</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2A26;--muted:#7C8A85;--line:#E4ECE8;--acc:#1F4D40;--acc2:#2F6B57;--mint:#E5F0EB;--soft:#F6FAF8;--in:#F1F6F3;--inb:#D6E3DC;--red:#C2453D;--green:#2E8B65;--card:rgba(255,255,255,.8);--sh:0 1px 2px rgba(22,52,42,.04),0 12px 32px rgba(22,52,42,.06)}
*{box-sizing:border-box}
html{background:#EEF4F1}
body{margin:0;min-height:100vh;color:var(--ink);font:13.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 12% -8%,#DCEBE3 0%,rgba(220,235,227,0) 62%),radial-gradient(900px 500px at 100% 0%,#E9F2EE 0%,rgba(233,242,238,0) 60%),linear-gradient(180deg,#EEF4F1 0%,#F5F9F7 100%) fixed}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:16px 49px 14px 28px;background:linear-gradient(180deg,rgba(238,244,241,.94),rgba(240,246,243,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{height:30px;width:auto;color:var(--ink);flex:none}
header h1{font-size:22px;font-weight:400;letter-spacing:-.015em;margin:0;line-height:1.2}
header h1 b{font-weight:650}
header .sub{margin:3px 0 0;font-style:italic;color:var(--muted);font-size:14px}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;width:min(410px,41vw);height:52px;padding:0 6px 0 22px;background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:var(--sh);cursor:text}
.search input{flex:1;min-width:0;background:none!important;border:none!important;box-shadow:none!important;padding:0!important;font-size:14px;font-weight:400}
.sb{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.sb svg{width:17px;height:17px}
main{padding:6px 49px 64px 53px;max-width:1600px;margin:0 auto}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--sh);padding:22px 24px;margin-bottom:20px;min-width:0}
h2{font-size:17px;font-weight:500;letter-spacing:-.01em;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2 i{font-style:normal;font-size:11px;font-weight:600;color:var(--acc2);background:var(--mint);border-radius:999px;padding:3px 9px;line-height:1.3}
.dn{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:10px 0 22px}
.dhead h3{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:0}
.dhead p{max-width:480px;margin:0 0 4px;color:#4F5F59;font-size:15px;line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-bottom:20px}
.tile{margin:0;display:flex;flex-direction:column}
.tile h4{margin:0;font-size:16px;font-weight:500}
.tile .big{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:26px 0 6px;font-variant-numeric:tabular-nums}
.tile .big.acc{color:var(--acc2)}
.tile small{color:var(--muted);font-size:12.5px}
.tile.int{background:linear-gradient(160deg,#FBF4EA,#fff 60%)}
.tile.int h4::after{content:"intern";font-size:10.5px;font-weight:600;color:#9A5B2E;background:#F7EBDD;border-radius:999px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.hero{background:linear-gradient(160deg,#D9EAE1 0%,#EEF6F2 55%,rgba(255,255,255,.85) 100%)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.steps span{background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500}
.steps b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;margin-right:6px}
.who{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;margin:0 0 16px}
.who label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#5F6F69}
.who input{width:300px;background:#fff}
input,select{font:inherit;color:var(--ink);font-weight:500;background:var(--in);border:1px solid transparent;border-radius:10px;padding:7px 10px;text-align:left;transition:border-color .15s,box-shadow .15s}
input:hover{border-color:var(--inb)}
input:focus{outline:none;background:#fff;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(47,107,87,.14)}
input::placeholder{color:#97A49F;font-weight:400}
.tw{overflow:auto;border:1px solid #EAF1ED;border-radius:14px;background:#fff;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:6px 9px;border-bottom:1px solid #EFF4F1;white-space:nowrap}
thead th{position:sticky;top:0;background:#F7FAF8;color:#5F6F69;font-size:11.5px;font-weight:500;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:normal;z-index:2;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:260px;max-width:420px}
th.us,td.us{background:#F3F8F5}
thead th.us{background:var(--mint);color:var(--acc2);font-weight:600}
th.you,td.you{background:#F4F7FC}
thead th.you{background:#E6EEF8;color:#2D4E86;font-weight:600}
td.up{color:var(--red);font-weight:600}td.down{color:var(--green);font-weight:600}
tr.gh td{font-weight:500;font-size:14px;padding-top:12px;padding-bottom:8px;background:#F3F8F5;border-bottom:1px solid #E6EFEA}
tr.gh td:first-child{color:var(--acc2)}
tr.sub td{font-weight:600;background:#FAFCFB;border-bottom:1px solid #E6EFEA}
tr.tot td{background:var(--mint);font-weight:600;font-size:14.5px}
tr.opt td.name{color:var(--muted);font-style:italic}
tr.qhide{display:none}
tbody tr[data-i]:hover td{background:#F5FAF7}
td input{width:110px;border-radius:8px;padding:5px 9px;background:#fff;border-color:var(--inb)}
.res{width:100%}.res td,.res th{background:none}.res tr:last-child td{font-weight:600}
.kgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;padding:6px 0;border-bottom:1px solid #EDF3F0;font-size:13px}
.kv b{font-weight:600;text-align:right}.kv span:last-child{color:var(--muted);font-size:11.5px;min-width:30px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.dgrid .card{margin:0}.dgrid .wide{grid-column:1/-1}
svg text{font-size:12px;fill:var(--ink);font-variant-numeric:tabular-nums}
svg text.lab{fill:#33433D}svg text.ax{fill:var(--muted);font-size:11px}svg text.val{fill:var(--ink);font-weight:600}svg text.hi{font-weight:700}
svg .hov:hover rect[fill=transparent]{fill:#F3F8F5}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px;font-size:12.5px;color:#33433D}
.lg{display:flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:2px;display:inline-block}
.lg i.rng{width:18px;height:6px;border-radius:3px}.lg i.dot{width:10px;height:10px;border-radius:50%}.lg i.dot.o{background:#fff;border:2px solid var(--ink)}.lg b{font-weight:600}
.tlhead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;margin:0 0 12px}
.tlhead label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.tlhead .btn{border:1px solid var(--inb);border-radius:999px;background:#fff;padding:8px 14px;font-size:12.5px;cursor:pointer;box-shadow:none}
.tlk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 16px}
.tlk div{background:var(--soft);border-radius:14px;padding:10px 14px}.tlk span{display:block;font-size:11.5px;color:var(--muted)}.tlk b{font-size:17px;font-weight:600}
.tlt{margin-top:14px;overflow:auto}.tlt table{min-width:100%;border:1px solid #EAF1ED;border-radius:14px;overflow:hidden}
.tlt td.late{color:var(--red);font-weight:600}.tlt td.early{color:var(--green);font-weight:600}
input.tli{width:150px}
.tip{white-space:pre-line;position:fixed;z-index:100;max-width:360px;background:var(--ink);color:#fff;font-size:12.5px;padding:10px 13px;border-radius:12px;pointer-events:none;display:none;box-shadow:0 12px 32px rgba(22,52,42,.22)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
button,.btn{font:inherit;font-weight:500;border:none;background:#fff;color:var(--ink);padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:var(--sh);font-size:14px}
button:hover,.btn:hover{color:var(--acc)}
button.pri{background:var(--acc);color:#fff}button.pri:hover{background:var(--acc2);color:#fff}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
#reply{display:none}
.err{color:var(--red);font-weight:500;margin:40px 0}
@media screen and (max-width:900px){.dgrid,.kgrid3{grid-template-columns:1fr}header{flex-wrap:wrap}.search{width:100%;margin:0}}
@media screen and (max-width:620px){header{padding:14px 16px}main{padding:6px 16px 60px}.who input{width:100%}.who label{width:100%}}
@page{size:A4 landscape;margin:8mm}
@media print{
  html,body{background:#EEF4F1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11.5px}
  header{position:static;backdrop-filter:none;background:none;padding:0 0 10px}
  .search,.actions,#reply,.steps,.tlhead .btn,.tip{display:none!important}
  main{padding:0;max-width:none}
  .card{backdrop-filter:none;box-shadow:none;background:#fff;border:1px solid #E1EAE5;padding:14px 16px;margin-bottom:12px;break-inside:avoid;border-radius:16px}
  .card.flow{break-inside:auto}
  .tiles{gap:12px;margin-bottom:12px}.tile .big{font-size:26px;margin-top:14px}
  .dgrid{gap:12px;margin-bottom:12px}
  .tw{max-height:none;overflow:visible;border:none;border-radius:0}
  thead{display:table-header-group}thead th{position:static}
  tr{break-inside:avoid}tr.gh{break-after:avoid}
  td input{border:none;background:none;padding:0;width:auto}
  .who input{border:none;background:none;padding:0}
  tr.qhide{display:table-row}
}
/* Kopf und Übersicht wie im Dashboard */
.brandpill{flex:none;display:grid;place-items:center;color:var(--ink)}
.brandpill .logo{height:30px;width:auto;display:block}
.ttl{min-width:0;margin-left:18px}
.ttl h1{font-size:27px;font-weight:500;letter-spacing:-.02em;margin:0;line-height:1.15}
.ttl p{margin:3px 0 0;font-style:italic;color:var(--muted);font-size:14px}
.toprow{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:20px;margin:0 0 20px}
.toprow.solo{grid-template-columns:minmax(0,1fr)}
.hero,.kc{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--sh)}
.hero{padding:26px 22px 22px;background:linear-gradient(160deg,#D9EAE1 0%,#EEF6F2 55%,rgba(255,255,255,.85) 100%);display:flex;flex-direction:column}
.hero h2{font-size:30px;font-weight:500;line-height:1.12;letter-spacing:-.025em;margin:0 0 6px 4px}
.hero .hs{margin:0 0 16px 4px;color:#5F6F69;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:none;border-radius:999px;padding:11px 20px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;margin-left:4px}
.pill.dark{background:var(--acc);color:#fff}.pill.dark:hover{background:var(--acc2)}
.imgslot{position:relative;margin-top:18px;flex:1;min-height:190px;border-radius:18px;overflow:hidden;background:var(--mint)}
.imgslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgslot.alpha{background:transparent}
.imgslot img.alpha{object-fit:contain}

.imgslot .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--acc2)}
.imgslot .ph svg{width:62%;max-width:260px;height:auto;opacity:.9}
.toprow.solo .imgslot{min-height:320px}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kc{padding:20px 22px;min-width:0}
.kc.int{background:linear-gradient(160deg,#FBF4EA,#fff 60%)}
.kh{display:flex;align-items:center;gap:12px}
.ki{flex:none;width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--acc2);display:grid;place-items:center}
.ki svg{width:19px;height:19px}
.kl{font-size:15px;font-weight:500;color:var(--ink)}
.kc b{display:block;font-size:32px;font-weight:500;letter-spacing:-.025em;margin:18px 0 4px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.kc b.acc{color:var(--acc2)}
.kc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
@media screen and (max-width:1100px){.toprow{grid-template-columns:1fr}.hero{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}.hero .imgslot{grid-column:2;grid-row:1/5;margin:0}}
@media screen and (max-width:860px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media screen and (max-width:620px){.hero{display:flex}.hero .imgslot{margin-top:18px}.ttl h1{font-size:22px}}
@media screen and (max-width:520px){.kgrid{grid-template-columns:1fr}.kc b{font-size:28px}}
@media print{ .hero .pill{display:none!important} .toprow{grid-template-columns:1fr 2fr;gap:8px;break-inside:avoid} .kgrid{gap:8px} .kc{padding:8px 10px} .kc b{font-size:18px;margin:6px 0 2px} .hero{padding:10px} .hero h2{font-size:18px} .imgslot{min-height:110px} .hero,.kc{backdrop-filter:none;box-shadow:none;background:#fff;border:1px solid #E1EAE5;border-radius:16px} .brandpill{box-shadow:none} }
/* Navigation links wie im Dashboard */
.side{position:fixed;left:16px;top:96px;bottom:16px;width:64px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:32px;box-shadow:var(--sh)}
.side .sp{flex:1}
.nv{width:44px;height:44px;border-radius:50%;border:none;background:none;color:#5F6F69;display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s,color .15s}
.nv svg{width:20px;height:20px}
.nv:hover{background:var(--mint);color:var(--acc)}
.nv[aria-pressed=true]{background:var(--acc);color:#fff}
.side .nv{background:none;border:none;box-shadow:none;color:#5F6F69}.side .nv:hover{background:var(--mint);color:var(--acc)}.side .nv[aria-pressed=true]{background:var(--acc);color:#fff}
main{padding-left:129px!important;max-width:none!important}
header{padding-left:24px!important}
html{scroll-behavior:smooth}
.card,.toprow,.dgrid{scroll-margin-top:96px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--acc);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--sh);transition:.2s;z-index:200}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media screen and (max-width:760px){.side{top:auto;bottom:12px;left:12px;right:12px;width:auto;height:64px;flex-direction:row;justify-content:space-around;padding:0 8px;border-radius:24px}.side .sp{display:none}main{padding:4px 16px 100px!important}#toast{bottom:90px}}
@media print{ body>*{display:none!important} body::before{content:"Drucken ist für diese Seite nicht freigegeben.";display:block;padding:40px;font:16px Inter,sans-serif;color:#1D2A26} }

<script>
const b64u=b=>{let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};

function sollIst(){
  const RZ=S.g.RZ, rows=DATA.order.filter(x=>C.SUB[x][5]>0||C.SUB[x].ihn).map(x=>{ const s=C.SUB[x];
    return {l:x,soll:s[5]*(1+RZ),ist:s.ihn?s.ih:null,n:s.ihn,ref:s.ihSoll*(1+RZ)}; }).sort((a,b)=>b.soll-a.soll);

      tx(labelW+Math.max(ws,r.ist!=null?r.ist/max*span:0)+8,y+rowH/2+4,`${F0.format(r.soll)} h`+(r.ist!=null?` · Ist ${F0.format(r.ist)} h (${d>=0?"+":""}${pct(d,0)})`:""),`class="val"`)+`</g>`; });

}

// G: Projektablauf (Timeline) mit Soll/Ist
const PH=[ // id, Name, Gewerke (Stunden), Vorgänger, ohne Arbeit (Trocknung)
  ["ht","Haustechnik-Vorarbeiten",["Haustechnik-Vorarbeiten"],[]],

  ["es","Estrich",["Estrich"],["tb"]],

  ["ma","Maler",["Maler"],["es"]],
  ["au","Außenarbeiten",["Außenarbeiten"],["ma"]],
  ["fl","Fliesen",["Fliesen"],["tr","au"]],
  ["bo","Bodenbeläge",["Bodenbeläge"],["fl"]],
  ["ft","Fensterbänke & Türen",["Fensterbänke & Türen"],["bo"]],

const PHDEF={}; PH.forEach(p=>p[2].forEach(x=>PHDEF[x]=p[0]));
const phOf=x=>(window.GPH&&window.GPH[x])||PHDEF[x]||"ba"; // Kategorie -> Phase (eigene Kategorien wählbar)
const gwsOf=id=>Object.keys(C.SUB||{}).filter(x=>phOf(x)===id);
const DAY=864e5, iso=d=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const pd=s=>{ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const HOL={}; function hol(y){ if(HOL[y]) return HOL[y]; // gesetzliche Feiertage Bayern (ohne Mariä Himmelfahrt)
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;
  const E=new Date(y,mo-1,da), o=n=>{const x=new Date(E); x.setDate(x.getDate()+n); return iso(x);};
  return HOL[y]=new Set([y+"-01-01",y+"-01-06",o(-2),o(1),y+"-05-01",o(39),o(50),o(60),y+"-10-03",y+"-11-01",y+"-12-25",y+"-12-26"]); }
const isWd=d=>d.getDay()%6!==0&&!hol(d.getFullYear()).has(iso(d));
const nextWd=d=>{ d=new Date(d); while(!isWd(d)) d.setDate(d.getDate()+1); return d; };
function addWd(d,n){ d=nextWd(d); let k=1; while(k<n){ d.setDate(d.getDate()+1); if(isWd(d)) k++; } return d; } // Ende nach n Arbeitstagen (inkl. Starttag)
const after=d=>{ d=new Date(d); d.setDate(d.getDate()+1); return nextWd(d); };
function wdBetween(a,b){ let n=0,d=new Date(a); const s=a<=b?1:-1; while(s>0?d<b:d>b){ d.setDate(d.getDate()+s); if(isWd(d)) n+=s; } return n; }
const fd=d=>d?d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}):"–";
function tlState(){ if(!S.tl){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+((8-d.getDay())%7||7)); S.tl={start:iso(d),ph:{}}; } S.tl.ph=S.tl.ph||{}; return S.tl; }
function tlCalc(){
  const tl=tlState(), g=S.g, cap=g.MA*g.SPT, out={}, start=nextWd(pd(tl.start)||new Date());
  PH.forEach(([id,name,,dep,fix])=>{ const p=tl.ph[id]||{}, gws=fix?[]:gwsOf(id);
    const soll=gws.reduce((a,x)=>a+(C.SUB[x]?C.SUB[x][5]:0),0)*(1+g.RZ), ist=gws.reduce((a,x)=>a+(C.SUB[x]&&C.SUB[x].ihn?C.SUB[x].ih:0),0), istN=gws.reduce((a,x)=>a+(C.SUB[x]?C.SUB[x].ihn:0),0), ref=gws.reduce((a,x)=>a+(C.SUB[x]?C.SUB[x].ihSoll:0),0)*(1+g.RZ);
    const auto=fix||Math.max(1,Math.ceil(soll/Math.max(1,cap)-1e-9)), days=p.d>0?p.d:auto;
    if(!fix&&soll<=0&&!(p.d>0)) { out[id]={id,name,skip:true}; return; }

    const pS=p.is?pd(p.is):(deps.length?after(new Date(Math.max(...deps.map(x=>x.pE)))):start);
    const pE=p.ie?pd(p.ie):addWd(pS,days);
    out[id]={id,name,soll,ist,istN,ref,auto,days,fix:!!fix,sS,sE:addWd(sS,days),pS,pE,is:p.is||"",ie:p.ie||"",done:!!p.ie,started:!!p.is};
  });
  return out;
}
function renderTL(){

// Kosten bei w Wochen (Lohn + Sonstige)
function costsW(w){ return S.g.MA*C.SW*w*C.KS+S.g.SON*w; }
// Provision an Bauzeit gekoppelt: bis zur Soll-Bauzeit volle Provision. Danach schrumpfen
// Provision und unser Gewinn im gleichen Verhältnis, wie der gemeinsame Überschuss
// (Endpreis − Kosten) durch die Mehrkosten sinkt.
function provFactor(T,j,w){ if(S.g.PKOPP!=="Ja") return 1; const soll=S.g.SOLLW, d=costsW(w)-costsW(soll);
  if(d<=0) return 1; const s0=T[j]-costsW(soll); if(s0<=0) return 0; return Math.max(0,(s0-d)/s0); }
function provAt(T,j,w){ return provBase(T,j)*provFactor(T,j,w); }
function provOf(T,j){ return provAt(T,j,C.WV); }
function provBase(T,j){ const p=S.g.PROVISION;
  if(j===4) return T[4]-T[3];                                   // bis: Aufschlag geht an Achim Bau GbR
  return S.g.PROVBASIS==="vom Endpreis" ? T[j]*p : T[j]*p/(1+p); // sonst: Spalte = Endpreis, Provision steckt darin
}

  if(sec.A&&C.LK!=null){ const prov=provOf(T,4), gew=T[4]-prov-C.LK-C.SK; ch.push(card("c_a","A","Wohin der Endpreis geht",stackBar([{l:"Lohnkosten",v:C.LK,c:DCOL.lohn},{l:"Sonstige Kosten",v:C.SK,c:DCOL.sonst},{l:"Provision",v:prov,c:DCOL.prov},{l:"Gewinn",v:Math.max(0,gew),c:DCOL.gew}],T[4]),"wide")); }
  if(sec.B&&C.LK!=null){ const PAN=["Min","Max","Ø Bayreuth","Unser Preis","Mit Provision"]; ch.push(card("c_b","B","Gewinn je Preisansatz",barsH([0,1,2,3,4].map(j=>{ const gj=T[j]-provOf(T,j)-C.LK-C.SK; return {l:PAN[j],v:gj,hi:j>=3,c:gj<0?"#A9B4B0":(j>=3?DCOL.bar:DCOL.barSoft),tip:"Einnahmen "+e0(T[j])}; }),{labelW:120}))); }
  if(sec.C&&C.LK!=null) ch.push(card("c_c","C","Gewinn nach Projektdauer",weeksLine()));
  if(sec.D&&C.LK!=null){ const prov=provOf(T,4), gew=T[4]-prov-C.LK-C.SK; ch.push(card("c_d","D","Umsatz und Gewinn je Gewerk",gewerkProfit(gew,prov))); }
  if(sec.E) ch.push(card("c_e","E","Arbeitsstunden je Gewerk: Soll und Ist",sollIst()));
  if(sec.F) ch.push(card("c_f","F","Unser Preis im Marktvergleich je Gewerk",`<p class="dn" style="margin-top:0">Heller Balken = Marktspanne Min–Max, Kreis = Ø Bayreuth, grüner Punkt = unser Preis.</p>`+rangePlot(P.o.filter(x=>C.SUB[x][3]>0).map(x=>{const s=C.SUB[x];return {l:x,mn:s[0],mx:s[1],bt:s[2],von:s[3],bis:s[4]};})),"wide"));
  if(ch.length) h+=`<div class="dgrid" id="dg">${ch.join("")}</div>`;
  if(sec.kalk&&P.kalk) h+=card("s_kalk","","Kalkulation",`<div class="kgrid3">${P.kalk.map(([t,rows])=>`<div><h4 style="margin:0 0 6px;font-weight:500">${esc(t)}</h4>${rows.map(r=>`<div class="kv"><span>${esc(r[0])}</span><b>${esc(r[1])}</b><span>${esc(r[2])}</span></div>`).join("")}</div>`).join("")}</div>`);
  if(sec.res&&P.res) h+=card("s_res","05","Einnahmen − Kosten = Gewinn je Preisansatz",`<div style="overflow:auto"><table class="res">${P.res.map((r,i)=>`<tr>${r.map((c,j)=>i===0?`<th class="${j?"n":""}">${esc(c)}</th>`:`<td class="${j?"n":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`,"flow");
  document.getElementById("m").innerHTML=h;
  if(sec.tl){ renderTL(); kpiTL(); }
  if(sec.liste){ document.getElementById("srch").style.display=""; render(); if(P.inp) wire(); const cb=document.getElementById("csv"); if(cb) cb.onclick=csv; }
}
function kpiTL(){ const a=document.getElementById("k_fin"); if(!a) return; const R=tlCalc(), L=Object.values(R).filter(x=>!x.skip), pEnd=new Date(Math.max(...L.map(x=>x.pE)));
  a.textContent=pEnd.toLocaleDateString("de-DE"); document.getElementById("k_fin2").textContent="bei Start am "+pd(S.tl.start).toLocaleDateString("de-DE");
  const ks=document.getElementById("k_st"); if(ks) ks.textContent=nextWd(pd(S.tl.start)).toLocaleDateString("de-DE");
  const st=nextWd(pd(S.tl.start)), wk=Math.ceil((wdBetween(st,pEnd)+1)/5), bz=document.getElementById("k_bz"); if(bz) bz.textContent=wk+" Wochen";
  const dry=L.find(x=>x.fix), e=document.getElementById("k_end"); if(e) e.textContent=L.length+" Bauphasen"+(dry?" · inkl. "+dry.days+" Arbeitstage Estrich-Trocknung":""); }
document.addEventListener("change",e=>{ if(e.target.dataset&&e.target.dataset.tl) setTimeout(kpiTL,0); });
document.addEventListener("click",e=>{ if(e.target.closest('[data-tl="reset"]')){ S.tl=JSON.parse(JSON.stringify(P.tl||{start:"",ph:{}})); persist(); renderTL(); kpiTL(); } },true);
function render(){
  const cols=P.c, isGP=id=>/^g[0-4]$/.test(id), inp=P.inp;
  let h=`<thead><tr><th>Nr</th><th>Leistung</th>${P.art?"<th>Art</th>":""}${P.einheit?"<th>Einheit</th>":""}${P.menge?'<th class="n">Menge</th>':""}${cols.map(c=>`<th class="n">${esc(c[1])}</th>`).join("")}<th class="n us">${esc(P.refName)}</th><th class="n us">Unser Gesamtpreis</th>${inp?'<th class="n you">Ihr Preis €/E</th><th class="n you">Ihr Gesamtpreis</th><th class="n you">Abweichung</th>':""}</tr></thead><tbody>`;
  const nc=2+(P.art?1:0)+(P.einheit?1:0)+(P.menge?1:0), extra=2+(inp?3:0);
  const sumC=(rs,j)=>rs.filter(r=>r[5]).reduce((a,r)=>a+(r[7+j]||0),0);
  P.o.forEach((g,gi)=>{ const rs=P.r.filter(r=>r[1]===gi); if(!rs.length) return;
    h+=`<tr class="gh" data-g="${gi}"><td>${String(gi+1).padStart(2,"0")}</td><td colspan="${nc-1+cols.length+extra}">${esc(g)}</td></tr>`;
    rs.forEach((r,k)=>{ const [i,,n,u,q,fest,rp]=r, vals=r.slice(7);
      h+=`<tr class="${fest?"":"opt"}" data-i="${i}" data-g="${gi}"><td style="color:var(--muted)">${gi+1}.${k+1}</td><td class="name">${esc(n)}</td>${P.art?`<td>${fest?"Fest":"Optional"}</td>`:""}${P.einheit?`<td>${esc(u)}</td>`:""}${P.menge?`<td class="n">${F2.format(q).replace(/,00$/,"")}</td>`:""}`+
         cols.map((c,j)=>`<td class="${c[0]==="note"?"":"n"}">${vals[j]==null?"":c[0]==="note"?esc(vals[j]):F2.format(vals[j])}</td>`).join("")+
         `<td class="n us"><b>${F2.format(rp)}</b></td><td class="n us">${F2.format(R2(q*rp))}</td>`+
         (inp?`<td class="n you"><input data-i="${i}" inputmode="decimal" value="${ST.p[i]!=null?F2.format(ST.p[i]):""}"></td><td class="n you" data-gp="${i}"></td><td class="n you" data-d="${i}"></td>`:"")+`</tr>`; });
    h+=`<tr class="sub" data-g="${gi}"><td></td><td colspan="${nc-1}">Summe ${esc(g)} (nur Fest)</td>${cols.map((c,j)=>`<td class="n">${isGP(c[0])?F0.format(sumC(rs,j))+" €":""}</td>`).join("")}<td class="us"></td><td class="n us">${F0.format(rs.filter(r=>r[5]).reduce((a,r)=>a+R2(r[4]*r[6]),0))} €</td>${inp?`<td class="you"></td><td class="n you" data-sg="${gi}"></td><td class="n you" data-sd="${gi}"></td>`:""}</tr>`;
  });
  h+=`<tr class="tot"><td></td><td colspan="${nc-1}">GESAMTSUMME netto (nur Fest)</td>${cols.map((c,j)=>`<td class="n">${isGP(c[0])?F0.format(sumC(P.r,j))+" €":""}</td>`).join("")}<td class="us"></td><td class="n us">${F0.format(P.r.filter(r=>r[5]).reduce((a,r)=>a+R2(r[4]*r[6]),0))} €</td>${inp?`<td class="you"></td><td class="n you" id="gt"></td><td class="n you" id="gd"></td>`:""}</tr>`;
  document.getElementById("t").innerHTML=h+"</tbody>"; if(inp) upd(); applySearch();
}
const dpc=(a,b)=>b>0?(a/b-1):null, fdp=v=>v==null?"":(v>0?"+":"")+nf(1).format(v*100)+" %";
function upd(){ let tot=0,ours=0,cnt=0,done=0; const sg={},so={};
  P.r.forEach(r=>{ const [i,gi,,,q,fest,rp]=r, p=ST.p[i], td=document.querySelector(`[data-gp="${i}"]`), dd=document.querySelector(`[data-d="${i}"]`);
    if(p!=null){ done++; const gp=R2(q*p); td.textContent=F2.format(gp); const d=dpc(p,rp); dd.textContent=fdp(d); dd.className="n you "+(d>0.005?"up":d<-0.005?"down":"");
      if(fest){ tot+=gp; ours+=R2(q*rp); sg[gi]=(sg[gi]||0)+gp; so[gi]=(so[gi]||0)+R2(q*rp); cnt++; } } else { td.textContent=""; dd.textContent=""; } });
  document.querySelectorAll("[data-sg]").forEach(td=>{ const v=sg[td.dataset.sg]; td.textContent=v?F0.format(v)+" €":""; const d=document.querySelector(`[data-sd="${td.dataset.sg}"]`); d.textContent=v?fdp(dpc(v,so[td.dataset.sg])):""; });
  document.getElementById("gt").textContent=cnt?F0.format(tot)+" €":""; document.getElementById("gd").textContent=cnt?fdp(dpc(tot,ours)):"";
  const ky=document.getElementById("k_you"); if(ky){ ky.textContent=cnt?F0.format(tot)+" €":"–"; document.getElementById("k_you2").textContent=cnt?`${done} von ${P.r.length} Positionen · ${fdp(dpc(tot,ours))} zu unserem Preis`:"Noch keine Preise eingetragen"; }
  const c=document.getElementById("cnt"); if(c) c.textContent=`${done} von ${P.r.length} Positionen ausgefüllt`+(cnt?` · Ihre Summe ${F0.format(tot)} € gegenüber unseren ${F0.format(ours)} € (gleiche Positionen)`:"");
  persist(); }
function applySearch(){ const t=(document.getElementById("q").value||"").trim().toLowerCase(), tb=document.querySelector("#t tbody"); if(!tb) return; const hit={};
  tb.querySelectorAll("tr[data-i]").forEach(tr=>{ const r=P.r.find(x=>x[0]===+tr.dataset.i); const ok=!t||(r[2]+" "+P.o[r[1]]).toLowerCase().includes(t); tr.classList.toggle("qhide",!ok); if(ok) hit[tr.dataset.g]=1; });
  tb.querySelectorAll("tr.gh,tr.sub").forEach(tr=>tr.classList.toggle("qhide",!!t&&!hit[tr.dataset.g])); }
document.addEventListener("input",e=>{ if(e.target.id==="q"){ applySearch(); const s=document.getElementById("s_liste"); if(e.target.value.trim()&&s&&s.getBoundingClientRect().top>innerHeight*.6) s.scrollIntoView({behavior:"smooth"}); }
  if(e.target.dataset.i!==undefined){ const v=parse(e.target.value); if(v===null) delete ST.p[e.target.dataset.i]; else ST.p[e.target.dataset.i]=v; upd(); }
  if(e.target.id==="who"){ ST.who=e.target.value; persist(); } });
document.addEventListener("change",e=>{ if(e.target.dataset.i!==undefined){ const v=ST.p[e.target.dataset.i]; e.target.value=v!=null?F2.format(v):""; } });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.tagName==="INPUT") e.target.blur(); });
function wire(){
  document.getElementById("who").value=ST.who||"";
  document.getElementById("mk").onclick=async()=>{ const p=Object.entries(ST.p).map(([i,v])=>[+i,v]);
    if(!p.length){ alert("Bitte zuerst mindestens einen Preis eintragen."); return; }
    if(!ST.who.trim()){ document.getElementById("who").focus(); alert("Bitte noch Ihren Namen oder Ihre Firma eintragen."); return; }
    const url=location.href.split("#")[0].replace(/teilen\.html$/,"")+"#antwort="+await pack({v:1,n:ST.who.trim(),ts:new Date().toLocaleString("de-DE"),p});
    document.getElementById("rl").value=url; document.getElementById("reply").style.display="block";
    document.getElementById("mail").href="mailto:?subject="+encodeURIComponent("Preise Itzgrund 12 – "+ST.who.trim())+"&body="+encodeURIComponent("Hallo,\n\nhier meine Preise zur Leistungsliste Itzgrund 12:\n"+url+"\n\nViele Grüße\n"+ST.who.trim());
    document.getElementById("reply").scrollIntoView({behavior:"smooth"}); };
  document.getElementById("cp").onclick=async e=>{ const t=document.getElementById("rl"); try{ await navigator.clipboard.writeText(t.value);}catch(_){ t.select(); document.execCommand("copy"); } e.target.textContent="Kopiert ✓"; };
}
function csv(){ const d=v=>String(typeof v==="number"?F2.format(v).replace(/\./g,""):(v??"")).replace(/;/g,",");
  const L=[["Gewerk","Leistung","Einheit","Menge",...P.c.map(c=>c[1]),P.refName,"Unser Gesamtpreis",...(P.inp?["Ihr Preis €/E","Ihr Gesamtpreis"]:[])].join(";")];
  P.r.forEach(r=>{ const p=ST.p[r[0]]; L.push([P.o[r[1]],r[2],r[3],r[4],...r.slice(7),r[6],R2(r[4]*r[6]),...(P.inp?[p??"",p!=null?R2(r[4]*p):""]:[])].map(d).join(";")); });
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\r\n")],{type:"text/csv"})); a.download="Leistungsliste_Itzgrund12.csv"; a.click(); }
// Druck: Tabelle auf Seitenbreite (A4 quer) verkleinern
const PW=1060; function fit(){ const t=document.getElementById("t"); if(!t) return; t.style.zoom=1; const w=t.scrollWidth; t.style.zoom=w>PW-34?((PW-34)/w).toFixed(3):1; }
window.addEventListener("beforeprint",fit); window.addEventListener("afterprint",()=>{ const t=document.getElementById("t"); if(t) t.style.zoom=""; });
(async()=>{ const m=location.hash.match(/d=([^&]+)/);
  if(!m){ document.getElementById("m").innerHTML='<p class="err">Dieser Link ist unvollständig. Bitte den kompletten Link aus der Nachricht öffnen.</p>'; return; }
  try{ P=await unpack(m[1]); }catch(e){ document.getElementById("m").innerHTML='<p class="err">Dieser Link ist beschädigt. Bitte den kompletten Link erneut öffnen.</p>'; return; }
  if(P.v===1){ P={v:2,t:P.t,d:P.d,o:P.o,sec:{liste:1,inp:1,ref:"von"},g:{},C:{TOT:[0,0,0,0,0],SUB:{},WV:0},c:P.c.filter(c=>c[0]!=="von"),r:P.r.map(r=>{ const vi=P.c.findIndex(c=>c[0]==="von"); const vals=r.slice(6); return [...r.slice(0,6),vi>=0?vals[vi]:0,...vals.filter((v,j)=>j!==vi)]; }),art:P.art,menge:P.menge,einheit:P.einheit,inp:1,refName:"Unser Preis €/E"}; }
  KEYS="preisabfrage_"+m[1].slice(-24);
  try{ const s=JSON.parse(localStorage.getItem(KEYS)); if(s&&s.p) ST=s; }catch(e){}
  S.g=P.g||{}; C=P.C||{}; DATA.order=P.o||[]; window.GPH=P.gph||{}; P.inp=P.sec.liste?P.inp:0;
  if(P.ih) Object.entries(P.ih).forEach(([x,[ih,n,soll]])=>{ if(C.SUB[x]){ C.SUB[x].ih=ih; C.SUB[x].ihn=n; C.SUB[x].ihSoll=soll; } });
  S.tl=ST.tl||(P.tl?JSON.parse(JSON.stringify(P.tl)):null);
  document.getElementById("subt").textContent=`${P.t} · ${P.ort||""} · netto, nur Lohn`;
  build(); buildNav(); })();
